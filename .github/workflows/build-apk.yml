name: Build Funland Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Funland APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify ZIP File
        run: |
          if [ ! -f "funland-app.zip" ]; then
            echo "ERROR: funland-app.zip was not found in repository root."
            exit 1
          fi
          unzip -tq funland-app.zip

      - name: Unzip project
        run: |
          mkdir -p funland-app
          unzip -o -q funland-app.zip -d funland-app
          if [ ! -f "funland-app/package.json" ]; then
            echo "ERROR: package.json not found inside extracted project."
            echo "Checking extracted files:"
            find funland-app -maxdepth 3 -type f | head -100
            exit 1
          fi

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: funland-app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: funland-app/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Dependencies
        working-directory: funland-app
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        working-directory: funland-app
        run: npm run lint

      - name: Build Web Bundle
        working-directory: funland-app
        run: npm run build

      - name: Sync Capacitor
        working-directory: funland-app
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: funland-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="funland-app/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload Funland APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: funland-android-debug-apk
          path: funland-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30


